services:
  ascii-front:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ascii-front
    restart: unless-stopped
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.ascii-front.rule=Host(`ascii-art.space`)"
      - "traefik.http.routers.ascii-front.entrypoints=websecure"
      - "traefik.http.routers.ascii-front.tls=true"
      - "traefik.http.routers.ascii-front.tls.certresolver=myresolver"
      - "traefik.http.services.ascii-front.loadbalancer.server.port=80"

networks:
  traefik-public:
    external: true
